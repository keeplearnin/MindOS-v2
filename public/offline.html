<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keel — offline</title>
<style>
  :root { --bg:#eef1f6; --card:#fff; --text:#0f172a; --muted:#64748b; --navy:#172554; --border:#d8dee8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#08090f; --card:#14172a; --text:#f0f1f5; --muted:#687290; --navy:#172554; --border:#2a3050; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding: 24px calc(24px + env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));
    text-align:center; -webkit-font-smoothing:antialiased;
  }
  .box { max-width: 340px; }
  h1 { font-size:1.35rem; margin:20px 0 8px; letter-spacing:-0.02em; }
  p { color: var(--muted); font-size:0.95rem; margin:0 0 22px; }
  button {
    font: inherit; font-size:0.95rem; font-weight:600; color:#fff; background: var(--navy);
    border:0; border-radius:12px; padding:12px 26px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  button:active { opacity:.85; }
  .hint { font-size:0.8rem; color: var(--muted); margin-top:18px; }
</style>
</head>
<body>
  <div class="box">
    <svg width="72" height="72" viewBox="0 0 512 512" aria-hidden="true">
      <rect width="512" height="512" rx="113" fill="#172554"/>
      <rect x="126" y="128" width="78" height="256" rx="14" fill="#fff"/>
      <path d="M220,238 L332,124 L388,178 L280,286 Z" fill="#fff"/>
      <path d="M280,226 L388,334 L332,388 L220,274 Z" fill="#fff"/>
    </svg>
    <h1>You&rsquo;re offline</h1>
    <p>Keel needs a connection to load your tasks and health data. Your logged data is safe.</p>
    <button onclick="location.reload()">Try again</button>
    <p class="hint" id="hint"></p>
  </div>
  <script>
    // Reload automatically the moment connectivity returns.
    window.addEventListener('online', function () { location.reload(); });
    document.getElementById('hint').textContent =
      navigator.onLine ? 'Connected — the server may be unreachable.' : 'Waiting for a connection…';
  </script>
</body>
</html>
